name: Release APK Build

# Signed Android release build.
# Sources are cloned from a private repository via token.
# Keystore and passwords come only from secrets and never appear in code or logs.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  APP_DIR: app-src

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout config
        uses: actions/checkout@v4

      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: ${{ env.APP_DIR }}
          fetch-depth: 0

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d ' \t\r\n' | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Validate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          file "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" | head -n 8

      - name: Build and sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"

          # 1. Compile Java sources if present and merge with classes.dex
          if [ -d "app-src/src/main/java" ]; then
            echo "Compiling Java sources..."
            mkdir -p build_classes
            javac -source 17 -target 17 \
              -cp "$ANDROID_SDK_ROOT/platforms/android-34/android.jar" \
              -d build_classes \
              $(find app-src/src/main/java -name "*.java")

            mkdir -p build_dex
            echo "Compiling Java sources into classes3.dex with D8..."
            "$BT/d8" \
              --output build_dex \
              --min-api 24 \
              $(find build_classes -name "*.class")

            cp build_dex/classes.dex app-src/classes3.dex
            echo "classes3.dex created successfully without touching base DEX layout."
          fi

          # 2. Extract pristine base archive to preserve all 1,326 case-sensitive resources
          echo "Extracting pristine base archive..."
          mkdir -p "$RUNNER_TEMP/base_extracted"
          unzip -q base.zip -d "$RUNNER_TEMP/base_extracted"
          rm -rf "$RUNNER_TEMP/base_extracted/META-INF"

          # Inject modified classes2.dex, supplementary classes3.dex, and native library
          echo "Injecting runtime components..."
          cp app-src/classes2.dex "$RUNNER_TEMP/base_extracted/classes2.dex"
          cp app-src/classes3.dex "$RUNNER_TEMP/base_extracted/classes3.dex"
          mkdir -p "$RUNNER_TEMP/base_extracted/lib/arm64-v8a"
          cp app-src/lib/arm64-v8a/libclient.so "$RUNNER_TEMP/base_extracted/lib/arm64-v8a/libclient.so"

          # Inject Nemesis assets
          echo "Injecting client assets..."
          cp -r app-src/assets/* "$RUNNER_TEMP/base_extracted/assets/" 2>/dev/null || true

          # Apply custom drawables and app icon over base resources without losing case-sensitive files
          echo "Applying custom launcher icon and drawables..."
          cp -r app-src/res/* "$RUNNER_TEMP/base_extracted/res/" 2>/dev/null || true

          # Package unsigned APK:
          # resources.arsc, dexopt profiles, and native libs MUST be stored uncompressed (-0)
          echo "Adding uncompressed resources, dexopt, and native libraries..."
          (cd "$RUNNER_TEMP/base_extracted" && zip -r -0 "$RUNNER_TEMP/unsigned.apk" \
            resources.arsc \
            assets/dexopt \
            lib \
            -x "*.bak" -x "*.git*" > /dev/null)

          # Compressed package contents
          echo "Packaging manifest, dex, and remaining assets..."
          (cd "$RUNNER_TEMP/base_extracted" && zip -r "$RUNNER_TEMP/unsigned.apk" \
            AndroidManifest.xml \
            classes*.dex \
            res \
            assets \
            -x "assets/dexopt/*" -x "*.bak" -x "*.git*" > /dev/null)

          # 3. Zipalign (4-byte alignment, page-aligns shared libraries)
          echo "Aligning APK..."
          "$BT/zipalign" -f -p 4 "$RUNNER_TEMP/unsigned.apk" "$RUNNER_TEMP/aligned.apk"

          # 4. Sign with v1 (JAR), v2 (APK), and v3 schemes explicitly enabled
          echo "Signing APK..."
          "$BT/apksigner" sign \
            --min-sdk-version 24 \
            --ks "$KEYSTORE_PATH" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias mykey \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$RUNNER_TEMP/client-release.apk" \
            "$RUNNER_TEMP/aligned.apk"

          echo "Verifying signature schemes:"
          "$BT/apksigner" verify -v "$RUNNER_TEMP/client-release.apk" | head -n 15
          ls -lh "$RUNNER_TEMP/client-release.apk"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="build-${{ github.run_number }}"
          gh release create "$TAG_NAME" \
            "$RUNNER_TEMP/client-release.apk#client-release.apk" \
            --title "Build ${{ github.run_number }}" \
            --notes "Direct APK download without zip"

      - name: Upload to Telegram
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          apk="$RUNNER_TEMP/client-release.apk"
          if [ -s "$apk" ] && [ -n "${TG_BOT_TOKEN:-}" ]; then
            echo "Uploading APK to Telegram..."
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TG_CHAT_ID}" \
              -F "document=@${apk}" \
              -F "caption=Nemesis-Build-${{ github.run_number }}-Fixed" \
              --fail --show-error -o /dev/null || echo "Telegram send skipped"
          fi
