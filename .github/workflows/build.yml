name: ci

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          submodules: recursive
          fetch-depth: 1

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: setup sdk
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: install ndk
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "build-tools;35.0.0" "ndk;26.3.11579264"

      - name: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: key
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d ' \t\r\n' | base64 --decode > "$RUNNER_TEMP/keystore.jks"
          test -s "$RUNNER_TEMP/keystore.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"
          ALIAS=$(keytool -list -v -keystore "$RUNNER_TEMP/keystore.jks" -storepass "${{ secrets.KEYSTORE_PASSWORD }}" 2>/dev/null | grep "Alias name:" | head -n 1 | awk '{print $3}')
          [ -z "$ALIAS" ] && ALIAS="mykey"
          echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: build
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            --no-daemon --stacktrace

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/**/*.apk

      - name: release
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE=$(find app/build/outputs/apk -name "*release*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            TAG="v${{ github.run_number }}"
            gh release create "$TAG" "$APK_FILE" --title "$TAG" --notes "build ${{ github.run_number }}" || true
          fi
