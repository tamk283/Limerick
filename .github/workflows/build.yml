name: Release APK Build

# Signed Android release build.
# Sources are cloned from a private repository via token.
# Keystore and passwords come only from secrets and never appear in code or logs.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  APP_DIR: app-src

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout config
        uses: actions/checkout@v4

      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: ${{ env.APP_DIR }}
          fetch-depth: 0

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d ' \t\r\n' | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Validate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          file "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" | head -n 8

      - name: Build and sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # 1. Compile Java sources if present
          if [ -d "app-src/src/main/java" ]; then
            echo "Compiling Java sources..."
            mkdir -p build_classes
            javac -source 17 -target 17 \
              -cp "$ANDROID_SDK_ROOT/platforms/android-34/android.jar" \
              -d build_classes \
              $(find app-src/src/main/java -name "*.java")
            
            mkdir -p build_dex
            "$ANDROID_SDK_ROOT/build-tools/34.0.0/d8" \
              --output build_dex \
              --min-api 26 \
              $(find build_classes -name "*.class")
            
            cp build_dex/classes.dex app-src/classes2.dex
            echo "Added classes2.dex"
          fi

          # 2. Package unsigned APK
          echo "Packaging APK..."
          (cd app-src && zip -r "$RUNNER_TEMP/unsigned.apk" \
            AndroidManifest.xml \
            resources.arsc \
            classes*.dex \
            res \
            assets \
            lib \
            -x "*.bak" -x "*.git*" > /dev/null)

          # 3. Zipalign
          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          "$BT/zipalign" -f -p 4 "$RUNNER_TEMP/unsigned.apk" "$RUNNER_TEMP/aligned.apk"

          # 4. Sign
          "$BT/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias mykey \
            --out "$RUNNER_TEMP/client-release.apk" \
            "$RUNNER_TEMP/aligned.apk"

          "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/client-release.apk" | head -n 8
          ls -lh "$RUNNER_TEMP/client-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-release-apk
          path: ${{ runner.temp }}/client-release.apk
          if-no-files-found: error

      - name: Upload to Telegram
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          apk="$RUNNER_TEMP/client-release.apk"
          if [ -s "$apk" ] && [ -n "${TG_BOT_TOKEN:-}" ]; then
            echo "Uploading APK to Telegram..."
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TG_CHAT_ID}" \
              -F "document=@${apk}" \
              -F "caption=client build ${{ github.run_number }}" \
              --fail --show-error -o /dev/null || echo "Telegram send skipped"
          fi
