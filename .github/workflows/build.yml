name: Build Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Fetch repository source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO || 'tamk283/lovely' }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java development environment
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android NDK r25c
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "build-tools;34.0.0" "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Cache build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prepare signing certificate
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d ' \t\r\n' | base64 --decode > "$RUNNER_TEMP/keystore/release.keystore"
          if [ ! -s "$RUNNER_TEMP/keystore/release.keystore" ]; then
            echo "::error::Failed to decode KEYSTORE_BASE64. Verify secret configuration."
            exit 1
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/keystore/release.keystore" >> "$GITHUB_ENV"

      - name: Verify application configuration
        run: |
          if [ ! -f "app/google-services.json" ]; then
            mkdir -p app
            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "app-launcher-ci",
              "storage_bucket": "app-launcher-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "org.levimc.launcher"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyPlaceholderKeyForCompilation"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Compile application release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="mykey" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            --no-daemon \
            --stacktrace

      - name: Store release artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/*/*.apk
          retention-days: 14
